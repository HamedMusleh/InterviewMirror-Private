<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verity — Jobs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#14171F; --ink-soft:#4A505C; --paper:#FBF9F5; --paper-dim:#F0ECE2; --line:#DEDACF;
    --signal:#2F8F6C; --signal-soft:#E3F0E9; --amber:#C08A2E; --amber-soft:#F6ECD8;
    --brick:#B24C3F; --brick-soft:#F4E1DE;
    --font-display:'Fraunces', serif; --font-body:'Inter', sans-serif; --font-mono:'IBM Plex Mono', monospace;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font-body);line-height:1.5;}
  button{font-family:inherit;cursor:pointer;}
  .hidden{display:none !important;}

  .topbar{background:var(--ink);color:var(--paper);display:flex;align-items:center;justify-content:space-between;padding:14px 32px;position:sticky;top:0;z-index:50;}
  .brand{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-size:19px;font-weight:600;}
  .brand-mark{width:20px;height:20px;border-radius:50%;border:2px solid var(--signal);position:relative;flex:none;}
  .brand-mark::after{content:"";position:absolute;inset:5px;border-radius:50%;background:var(--signal);}
  .nav-tabs{display:flex;gap:6px;}
  .nav-tabs button{border:none;background:transparent;color:rgba(251,249,245,0.65);padding:8px 16px;border-radius:8px;font-size:13.5px;font-weight:600;}
  .nav-tabs button.active{background:rgba(255,255,255,0.12);color:var(--paper);}
  .nav-tabs button:focus-visible{outline:2px solid var(--signal);outline-offset:2px;}
  .rec-avatar{width:32px;height:32px;border-radius:50%;background:var(--signal);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:700;flex:none;}

  main{max-width:1240px;margin:0 auto;padding:36px 32px 96px;}

  .page-head{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:16px;margin-bottom:20px;}
  .page-head h1{font-family:var(--font-display);font-size:30px;font-weight:600;margin:0 0 4px;}
  .page-head .sub{font-size:13.5px;color:var(--ink-soft);}
  .new-job-btn{background:var(--ink);color:var(--paper);border:none;border-radius:8px;padding:11px 18px;font-size:13.5px;font-weight:600;}
  .new-job-btn:hover{opacity:.88;}
  .new-job-btn:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--signal);outline-offset:2px;}

  .mini-stats{display:flex;gap:14px;margin-bottom:26px;flex-wrap:wrap;}
  .mini-stat{background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px 16px;font-size:12.5px;color:var(--ink-soft);display:flex;align-items:center;gap:8px;}
  .mini-stat strong{font-family:var(--font-mono);color:var(--ink);font-size:15px;}

  .toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:22px;}
  .toolbar input[type=text]{border:1px solid var(--line);border-radius:8px;padding:9px 12px;font-size:13.5px;min-width:220px;background:#fff;}
  .toolbar select{border:1px solid var(--line);border-radius:8px;padding:9px 10px;font-size:13.5px;background:#fff;color:var(--ink);}

  .job-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;}
  @media (max-width:820px){.job-grid{grid-template-columns:1fr;}}

  .job-card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:22px;display:flex;flex-direction:column;gap:14px;}
  .job-card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
  .job-dept{font-family:var(--font-mono);font-size:10.5px;letter-spacing:1.2px;text-transform:uppercase;color:var(--signal);margin-bottom:6px;}
  .job-card h3{font-family:var(--font-display);font-size:20px;margin:0 0 4px;}
  .job-meta{font-size:12.5px;color:var(--ink-soft);}
  .job-meta span:not(:last-child)::after{content:"·";margin:0 6px;color:var(--line);}
  .status-pill{padding:3px 10px;border-radius:999px;font-size:11px;font-weight:700;flex:none;}
  .status-pill.open{background:var(--signal-soft);color:var(--signal);}
  .status-pill.closed{background:var(--paper-dim);color:var(--ink-soft);}
  .status-pill.draft{background:var(--amber-soft);color:var(--amber);}

  .tag-row{display:flex;flex-wrap:wrap;gap:6px;}
  .tag{background:var(--paper-dim);border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:11.5px;color:var(--ink-soft);}

  .job-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:12px 0;border-top:1px solid var(--paper-dim);border-bottom:1px solid var(--paper-dim);}
  .job-stat-num{font-family:var(--font-mono);font-size:16px;}
  .job-stat-label{font-size:10.5px;color:var(--ink-soft);}

  .job-card-foot{display:flex;justify-content:space-between;align-items:center;}
  .view-btn{background:var(--ink);color:var(--paper);border:none;border-radius:7px;padding:9px 14px;font-size:12.5px;font-weight:600;}
  .view-btn:hover{opacity:.88;}
  .icon-btn{background:none;border:1px solid var(--line);border-radius:7px;padding:8px 11px;font-size:12px;color:var(--ink-soft);}
  .icon-btn:hover{background:var(--paper-dim);}
  .job-posted{font-size:11px;color:var(--ink-soft);font-family:var(--font-mono);}

  .empty-state{grid-column:1/-1;text-align:center;padding:50px 20px;color:var(--ink-soft);font-size:13.5px;background:#fff;border:1px dashed var(--line);border-radius:var(--radius);}

  .toast{position:fixed;bottom:22px;right:22px;background:var(--ink);color:var(--paper);padding:12px 18px;border-radius:8px;font-size:13px;box-shadow:0 8px 24px rgba(20,23,31,.25);z-index:80;opacity:0;transform:translateY(8px);transition:opacity .2s,transform .2s;}
  .toast.show{opacity:1;transform:translateY(0);}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand"><span class="brand-mark"></span>Verity</div>
  <div class="nav-tabs">
    <button>Dashboard</button>
    <button class="active">Jobs</button>
    <button>Candidates</button>
    <button>Settings</button>
  </div>
  <div class="rec-avatar">RH</div>
</div>

<main>
  <div class="page-head">
    <div>
      <h1>Jobs</h1>
      <div class="sub">Every role you're hiring for, open, closed, or still in draft</div>
    </div>
    <button class="new-job-btn" onclick="showToast('Opens the new job posting page')">+ New job posting</button>
  </div>

  <div class="mini-stats">
    <div class="mini-stat"><strong>3</strong> open</div>
    <div class="mini-stat"><strong>1</strong> draft</div>
    <div class="mini-stat"><strong>1</strong> closed</div>
    <div class="mini-stat"><strong>162</strong> total applicants</div>
  </div>

  <div class="toolbar">
    <input type="text" id="searchInput" placeholder="Search roles" oninput="applyFilters()">
    <select id="deptFilter" onchange="applyFilters()">
      <option value="">All departments</option>
      <option value="Engineering">Engineering</option>
      <option value="Design">Design</option>
      <option value="Data">Data</option>
      <option value="Operations">Operations</option>
    </select>
    <select id="statusFilter" onchange="applyFilters()">
      <option value="">All statuses</option>
      <option value="open">Open</option>
      <option value="draft">Draft</option>
      <option value="closed">Closed</option>
    </select>
    <select id="sortSelect" onchange="applyFilters()">
      <option value="posted">Sort: Newest</option>
      <option value="applicants">Sort: Most applicants</option>
      <option value="score">Sort: Avg score</option>
    </select>
  </div>

  <div class="job-grid" id="jobGrid"></div>
</main>

<div class="toast" id="toast"></div>

<script>
const jobs = [
  {role:'Senior Backend Engineer', dept:'Engineering', location:'Remote · MENA time zones', type:'Full-time',
   tags:['Go','PostgreSQL','System Design'], applicants:47, review:24, shortlisted:6, avgScore:81, status:'open', posted:'Jul 12', postedSort:5},
  {role:'Product Designer', dept:'Design', location:'Ramallah · Hybrid', type:'Full-time',
   tags:['Figma','Design Systems','Prototyping'], applicants:38, review:14, shortlisted:4, avgScore:77, status:'open', posted:'Jul 18', postedSort:6},
  {role:'Data Analyst', dept:'Data', location:'Remote', type:'Full-time',
   tags:['SQL','Python','Dashboards'], applicants:52, review:19, shortlisted:9, avgScore:84, status:'open', posted:'Jul 9', postedSort:4},
  {role:'Customer Success Lead', dept:'Operations', location:'Nablus · On-site', type:'Full-time',
   tags:['CRM','Client Relations'], applicants:25, review:3, shortlisted:2, avgScore:79, status:'closed', posted:'Jun 20', postedSort:1},
  {role:'Machine Learning Engineer', dept:'Engineering', location:'Remote', type:'Full-time',
   tags:['PyTorch','NLP','MLOps'], applicants:0, review:0, shortlisted:0, avgScore:null, status:'draft', posted:'Not posted yet', postedSort:7}
];

function renderJobs(list){
  const grid = document.getElementById('jobGrid');
  if(list.length===0){
    grid.innerHTML = `<div class="empty-state">No roles match these filters. Try clearing search or filters.</div>`;
    return;
  }
  grid.innerHTML = list.map(j=>`
    <div class="job-card">
      <div class="job-card-top">
        <div>
          <div class="job-dept">${j.dept}</div>
          <h3>${j.role}</h3>
          <div class="job-meta"><span>${j.location}</span><span>${j.type}</span></div>
        </div>
        <span class="status-pill ${j.status}">${j.status.charAt(0).toUpperCase()+j.status.slice(1)}</span>
      </div>
      <div class="tag-row">${j.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div>
      <div class="job-stats">
        <div><div class="job-stat-num">${j.applicants}</div><div class="job-stat-label">Applicants</div></div>
        <div><div class="job-stat-num">${j.review}</div><div class="job-stat-label">In review</div></div>
        <div><div class="job-stat-num">${j.shortlisted}</div><div class="job-stat-label">Shortlisted</div></div>
        <div><div class="job-stat-num">${j.avgScore ?? '—'}</div><div class="job-stat-label">Avg score</div></div>
      </div>
      <div class="job-card-foot">
        <span class="job-posted">Posted ${j.posted}</span>
        <div style="display:flex;gap:8px;">
          <button class="icon-btn" onclick="showToast('Opens the editor for ${j.role}')">Edit</button>
          <button class="view-btn" onclick="showToast('Opens the candidate list for ${j.role}')">View candidates</button>
        </div>
      </div>
    </div>
  `).join('');
}
renderJobs(jobs);

function applyFilters(){
  const q = document.getElementById('searchInput').value.toLowerCase();
  const dept = document.getElementById('deptFilter').value;
  const status = document.getElementById('statusFilter').value;
  const sort = document.getElementById('sortSelect').value;

  let list = jobs.filter(j=>
    j.role.toLowerCase().includes(q) &&
    (!dept || j.dept===dept) &&
    (!status || j.status===status)
  );
  if(sort==='applicants') list = list.slice().sort((a,b)=>b.applicants-a.applicants);
  if(sort==='score') list = list.slice().sort((a,b)=>(b.avgScore??-1)-(a.avgScore??-1));
  if(sort==='posted') list = list.slice().sort((a,b)=>b.postedSort-a.postedSort);

  renderJobs(list);
}

let toastTimer;
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 2400);
}
</script>
</body>
</html>

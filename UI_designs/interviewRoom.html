<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Interview Room UI</title>
<style>

  * { box-sizing: border-box; }

  body {

    margin: 0;

    min-height: 100vh;

    display: flex;

    align-items: center;

    justify-content: center;

    background: #eef0f2;

    font-family: 'Segoe UI', Arial, sans-serif;

  }
 
  .call-frame {

    position: relative;

    width: 900px;

    max-width: 95vw;

    border: 3px solid #111;

    border-radius: 26px;

    background: #fff;

    padding: 30px 30px 26px;

  }
 
  .top-bar {

    display: flex;

    justify-content: center;

    align-items: center;

    position: relative;

    margin-bottom: 14px;

  }
 
  .video-wrap {

    position: relative;

    width: 460px;

    max-width: 100%;

    aspect-ratio: 1 / 1;

    margin: 0 auto;

    border-radius: 4px;

    overflow: hidden;

  }
 
  .video-wrap img {

    display: block;

    width: 100%;

    height: 100%;

    object-fit: cover;

  }
 
  .progress-line {

    position: absolute;

    top: 12px;

    left: 50%;

    transform: translateX(-50%);

    width: 55%;

    height: 5px;

    background: #fff;

    border-radius: 3px;

    z-index: 3;

  }
 
  .rec-dots {

    position: absolute;

    top: 24px;

    right: 14px;

    display: flex;

    gap: 6px;

    z-index: 3;

  }

  .rec-dots span {

    width: 8px;

    height: 8px;

    border-radius: 50%;

  }

  .rec-dots span:first-child { background: #ff8c00; }

  .rec-dots span:last-child { background: #e21b1b; }
 
  .timer-badge {

    position: absolute;

    top: 16px;

    right: 16px;

    z-index: 4;

    display: flex;

    align-items: center;

    gap: 8px;

    border: 2px solid #e21b1b;

    color: #e21b1b;

    border-radius: 10px;

    padding: 6px 14px;

    font-size: 16px;

    font-weight: 600;

    background: rgba(255,255,255,0.9);

  }
 
  .rec-ring {

    width: 20px;

    height: 20px;

    border-radius: 50%;

    border: 2px solid #e21b1b;

    display: flex;

    align-items: center;

    justify-content: center;

    flex-shrink: 0;

  }

  .rec-ring::after {

    content: "";

    width: 9px;

    height: 9px;

    background: #e21b1b;

    border-radius: 50%;

  }
 
  .caption-box {

    margin: 18px auto 0;

    max-width: 460px;

    border: 2px solid #111;

    border-radius: 10px;

    padding: 14px 22px;

    text-align: center;

  }

  .caption-box p {

    margin: 0;

    color: #e21b1b;

    font-family: 'Comic Sans MS', 'Segoe Print', cursive;

    font-size: 22px;

  }
 
  .controls {

    display: flex;

    justify-content: center;

    align-items: flex-end;

    gap: 46px;

    margin-top: 26px;

    position: relative;

  }
 
  .control {

    display: flex;

    flex-direction: column;

    align-items: center;

    gap: 6px;

    font-size: 13px;

    color: #333;

  }
 
  .control .icon {

    width: 40px;

    height: 40px;

    border-radius: 50%;

    display: flex;

    align-items: center;

    justify-content: center;

    background: #f2f2f2;

  }
 
  .leave .icon {

    background: #e21b1b;

    color: #fff;

  }
 
  .share .icon {

    background: #111;

    color: #fff;

    border-radius: 8px;

  }
 
  .people-count {

    position: absolute;

    top: -4px;

    right: -6px;

    background: #111;

    color: #fff;

    font-size: 10px;

    border-radius: 50%;

    width: 16px;

    height: 16px;

    display: flex;

    align-items: center;

    justify-content: center;

  }
 
  .avatar {

    position: absolute;

    bottom: 20px;

    right: 24px;

    width: 90px;

    height: 90px;

    border-radius: 50%;

    background: #29b6f6;

    display: flex;

    align-items: flex-end;

    justify-content: center;

    overflow: hidden;

  }

  .avatar img {

    width: 78%;

    object-fit: contain;

  }
 
  svg { width: 20px; height: 20px; }
</style>
</head>
<body>
 
<div class="call-frame">
 
  <div class="top-bar">
<div class="progress-line"></div>
</div>
 
  <div class="video-wrap">
<img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=600&q=80" alt="Participant video">
<div class="rec-dots"><span></span><span></span></div>
<div class="timer-badge"><span class="rec-ring"></span>12:9</div>
</div>
 
  <div class="caption-box">
<p>Hello, I hope ur doing well</p>
</div>
 
  <div class="controls">
<div class="control leave">
<div class="icon">
<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1-9.4 0-17-7.6-17-17 0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.4 0 .8-.2 1L6.6 10.8z"/></svg>
</div>

      Leave
</div>
 
    <div class="control">
<div class="icon">
<svg viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2"><path d="M21 11.5a8.4 8.4 0 0 1-8.9 8.4 8.6 8.6 0 0 1-3.5-.8L3 21l1.9-5.6a8.4 8.4 0 0 1-.9-3.9A8.4 8.4 0 0 1 12.5 3 8.4 8.4 0 0 1 21 11.5z"/></svg>
</div>

      Chat
</div>
 
    <div class="control share">
<div class="icon">
<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M12 3v12M7 8l5-5 5 5M5 21h14"/></svg>
</div>

      Share
</div>
 
    <div class="control">
<div class="icon">
<svg viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2"><rect x="2" y="6" width="14" height="12" rx="2"/><path d="M16 10l6-3v10l-6-3"/></svg>
</div>

      Camera
</div>
 
    <div class="control">
<div class="icon">
<svg viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v4"/></svg>
</div>

      Mic
</div>
 
    <div class="control" style="position:relative;">
<div class="icon">
<svg viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2"><circle cx="9" cy="8" r="3"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="17" cy="9" r="2.5"/><path d="M15 20c0-2.5 1.8-4.5 4-5"/></svg>
</div>
<span class="people-count">2</span>

      People
</div>
</div>
 
  <div class="avatar">
<img src="https://images.unsplash.com/photo-1633332755192-727a05c4013d?w=200&q=80" alt="Small participant">
</div>
 
</div>
 
</body>
</html>
